name: Good

on:
  push:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: good-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/local
      - run: echo ok

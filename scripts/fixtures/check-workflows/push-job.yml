name: Push job

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: push-job
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Exception to "persist-credentials: false": this job pushes the version commit and tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

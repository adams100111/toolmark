name: Docs deploy

# Publishes the VitePress site (docs/) to GitHub Pages. Inert while the repository is private:
# the deploy job only runs once the owner makes the repo public and enables Pages with the
# "GitHub Actions" source (spec §21/§22). M5 hardens this workflow; it never adds a second one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (version in the trailing comment).
jobs:
  build:
    # Stays a no-op while the repo is private (owner action O6: no CI-minutes budget is spent
    # publishing docs nobody can browse yet); the deploy job below carries the same guard.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      # No package-manager cache (SEC-14): this job feeds `deploy` (id-token), and a cache entry
      # written by another default-branch job could plant code in the built site.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm docs:build
        env:
          DOCS_BASE: /toolmark/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

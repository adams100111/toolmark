name: Spec watch

# Post-release weekly spec-watch (spec §21; D28 keeps the WebMCP adapter experimental until the
# spec leaves origin trial). `watch` diffs the three watched WebMCP sources against
# .spec-watch/state.json and opens/updates an issue plus a hash-update PR on drift. `canary` and
# `wpt` are informational only (spec §21: "WebMCP WPT suites are informational... the adapter's own
# WebMCP suites on Chromium gate") — both `continue-on-error: true`, never required. `audit` is a
# weekly `pnpm audit` tripwire.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/spec-watch.yml'
      - 'scripts/spec-watch.mjs'
      - '.spec-watch/**'

permissions: {}

concurrency:
  group: spec-watch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dry-run until Task 7d flips this (the PR-triggered `validate` job always sets it itself):
  # spec-watch.mjs opens/updates no issue and writes no state, git-commit-and-PR is skipped,
  # canary/wpt/audit issue-opening still runs (those aren't gated by this — they only fire
  # `on: failure()`, which a dry run of `watch` doesn't affect).
  SPEC_WATCH_DRY_RUN: '1'

# Third-party and GitHub actions are pinned to full commit SHAs (version in the trailing comment),
# each dereferenced with `gh api repos/<owner>/<repo>/commits/<tag>` on 2026-09-25.
#
# SEC-9 (docs/security/review-2026.md): a same-repository pull request gets a write-capable token,
# so on `pull_request` only the read-only `validate` job runs (no secrets, no persisted
# credential). Every job with write permissions or a token runs only on `schedule` /
# `workflow_dispatch` (the default branch's code). scripts/spec-watch-workflow.test.mjs checks it.
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SPEC_WATCH_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: spec-watch tests
        run: node --test scripts/spec-watch.test.mjs scripts/spec-watch-workflow.test.mjs
      - name: spec-watch (dry run, no token)
        run: node scripts/spec-watch.mjs

  watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Exception to "persist-credentials: false" (workflow-hardening rule): this job pushes a
      # spec-watch/<date> branch with the new hashes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: spec-watch
        id: spec-watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/spec-watch.mjs
      - name: Open a PR with the new hashes
        if: steps.spec-watch.outputs.changed == 'true' && env.SPEC_WATCH_DRY_RUN != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .spec-watch/state.json; then
            echo "state.json unchanged on disk after a non-dry run; nothing to commit" >&2
            exit 1
          fi
          branch="spec-watch/$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .spec-watch/state.json
          git commit -m "chore(spec-watch): record new WebMCP source hashes"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(spec-watch): WebMCP source(s) changed (${{ steps.spec-watch.outputs.changed-keys }})" \
            --body "Opened by the weekly spec-watch workflow. See the linked \"WebMCP spec changed\" issue(s) for the diff." \
            --base main \
            --head "$branch"

  # Runs the M3 WebMCP suite that needs a real browser (packages/core/test/browser-webmcp-polyfill.
  # test.ts) and examples/react-vite/e2e/webmcp.spec.ts against Chrome Dev with WebMCP's testing
  # flag on. See .spec-watch/{playwright,vitest}.canary.config.ts for the verified channel/flag and
  # why this needs its own config files rather than editing the example's or core's.
  canary:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built output first: examples/react-vite's webmcp.spec.ts imports @toolmark/testing from
      # dist (M1 pass-4 ruling).
      - run: pnpm -r --filter "./packages/*" build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Dev
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-canary-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chrome-dev
      # Chrome Canary itself is not distributed for Linux (verified 2026-09-25); `chrome-dev` is
      # the closest continuously-updated Linux channel — see the two config files' header comments.
      - name: Install Chrome Dev
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chrome-dev
      - name: Install Chrome Dev system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chrome-dev
      - name: Vitest (browser-webmcp-polyfill.test.ts, Chrome Dev + WebMCPTesting)
        run: pnpm exec vitest run --config .spec-watch/vitest.canary.config.ts
      - name: Playwright (webmcp.spec.ts, Chrome Dev + WebMCPTesting)
        run: pnpm exec playwright test --config .spec-watch/playwright.canary.config.ts webmcp.spec.ts
      - name: 'Open/update "WebMCP adapter failing on Chrome Canary" issue'
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="WebMCP adapter failing on Chrome Canary"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The \`canary\` job in spec-watch.yml failed on Chrome Dev (Chrome Canary itself is not distributed for Linux) with WebMCP's testing flag (\`--enable-blink-features=WebMCPTesting\`) on.

          Run: $run_url"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Informational (spec §21): sparse-checks out web-platform-tests/wpt's webmcp/ suite and runs it
  # against Chrome Canary. Expected to fail or skip on `ubuntu-latest` (Chrome Canary is Windows/
  # macOS only — same substitution problem as `canary`, but the WPT test runner's own `chrome_canary`
  # product does not accept a channel override the way Playwright does), which is fine: this job
  # never blocks and reports whatever it manages to run.
  wpt:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Sparse checkout web-platform-tests/wpt (webmcp/ only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: web-platform-tests/wpt
          ref: master # verified 2026-09-25: wpt's default branch is `master`, not `main`
          sparse-checkout: |
            webmcp
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: wpt run chrome_canary webmcp
        run: |
          ./wpt install-browser --browser=chrome --channel=canary
          ./wpt run --binary-arg=--enable-blink-features=WebMCPTesting chrome_canary webmcp

  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: 'Open/update "Dependency audit: high severity" issue'
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Dependency audit: high severity"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="\`pnpm audit --prod --audit-level high\` failed in the weekly spec-watch workflow.

          Run: $run_url"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

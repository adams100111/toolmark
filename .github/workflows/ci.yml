name: CI

# Spec §21 / R6 release matrix (M5 Task 1). The full matrix runs on pull requests to main, on pushes
# to main and nightly; a push to any other branch runs only the node 24 × react 19.3.0 × inertia
# 3.7.1 cell on Chromium (owner O6, CI minutes). Branch protection names the full-matrix jobs.
on:
  pull_request:
    branches: [main]
  push:
  schedule:
    - cron: '0 3 * * *'

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Every push to main (and every nightly run) completes; superseded runs on other refs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Third-party and GitHub actions are pinned to full commit SHAs (version in the trailing comment);
# scripts/check-workflows.mjs enforces the hardening rules.
jobs:
  # Chooses the matrix: full, or the reduced push cell for branches other than main.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - id: plan
        env:
          FULL: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        # suite: `full` = every Vitest project (DOM projects on Chromium; Firefox and WebKit run in
        # the `browser` jobs); `react18` = react, inertia and core-browser; `inertia2` = inertia.
        # React 18.3 × Inertia 3 is never included (Inertia 3 requires React 19). zod is 4.6.5 in
        # every cell (the zod 3 axis is the `zod3` job).
        run: |
          if [ "$FULL" = true ]; then
            unit='[
              {"node":"22","react":"19.3.0","inertia":"3.7.1","suite":"full"},
              {"node":"24","react":"19.3.0","inertia":"3.7.1","suite":"full"},
              {"node":"24","react":"18.3.1","inertia":"2.3.28","suite":"react18"},
              {"node":"24","react":"19.3.0","inertia":"2.3.28","suite":"inertia2"}
            ]'
            browsers='["chromium","firefox","webkit"]'
          else
            unit='[{"node":"24","react":"19.3.0","inertia":"3.7.1","suite":"full"}]'
            browsers='["chromium"]'
          fi
          echo "unit=$(jq -c . <<<"$unit")" >> "$GITHUB_OUTPUT"
          echo "browsers=$(jq -c . <<<"$browsers")" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit:
    name: unit (node ${{ matrix.node }}, react ${{ matrix.react }}, inertia ${{ matrix.inertia }})
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-default cells swap the React / Inertia dev versions in place (never committed).
      - name: Use React ${{ matrix.react }}
        if: matrix.react != '19.3.0'
        env:
          REACT_VERSION: ${{ matrix.react }}
        run: |
          major="${REACT_VERSION%%.*}"
          pnpm -F @toolmark/core -F @toolmark/react -F @toolmark/inertia add -D \
            "react@${REACT_VERSION}" "react-dom@${REACT_VERSION}" \
            "@types/react@${major}" "@types/react-dom@${major}"
      - name: Use Inertia ${{ matrix.inertia }}
        if: matrix.inertia != '3.7.1'
        env:
          INERTIA_VERSION: ${{ matrix.inertia }}
        run: pnpm -F @toolmark/inertia add -D "@inertiajs/react@${INERTIA_VERSION}"
      - name: Re-install after version swap
        if: matrix.react != '19.3.0' || matrix.inertia != '3.7.1'
        run: pnpm install --no-frozen-lockfile
      # Fails the cell when the resolved versions are not the matrix ones (a silent no-op swap).
      - name: Assert React ${{ matrix.react }} / Inertia ${{ matrix.inertia }} / zod 4.6.5 are resolved
        env:
          REACT_VERSION: ${{ matrix.react }}
          INERTIA_VERSION: ${{ matrix.inertia }}
        run: |
          set -euo pipefail
          major="${REACT_VERSION%%.*}"
          for pkg in @toolmark/core @toolmark/react @toolmark/inertia; do
            out="$(pnpm -F "$pkg" list react @types/react zod --depth 0)"
            echo "$out"
            grep -qF " react@${REACT_VERSION}" <<<"$out" \
              || { echo "::error::$pkg does not resolve react@${REACT_VERSION}"; exit 1; }
            grep -qF " @types/react@${major}." <<<"$out" \
              || { echo "::error::$pkg does not resolve @types/react@${major}"; exit 1; }
            grep -qF " zod@4.6.5" <<<"$out" \
              || { echo "::error::$pkg does not resolve zod@4.6.5"; exit 1; }
          done
          out="$(pnpm -F @toolmark/inertia list @inertiajs/react --depth 0)"
          echo "$out"
          grep -qF " @inertiajs/react@${INERTIA_VERSION}" <<<"$out" \
            || { echo "::error::@toolmark/inertia does not resolve @inertiajs/react@${INERTIA_VERSION}"; exit 1; }
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Resolves workspace sources via the @toolmark/source condition: no build needed. DOM projects
      # run their Chromium instance here; Firefox and WebKit run in the `browser` jobs.
      - name: Vitest (${{ matrix.suite }})
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            full) projects=(--project '!*(firefox)' --project '!*(webkit)') ;;
            react18) projects=(--project 'react (chromium)' --project 'inertia (chromium)' --project 'core-browser (chromium)') ;;
            inertia2) projects=(--project 'inertia (chromium)') ;;
            *) echo "::error::unknown suite $SUITE"; exit 1 ;;
          esac
          pnpm exec vitest run "${projects[@]}"

  # Spec §21: zod 4 everywhere, plus a zod 3 axis that runs only the converter-specific tests (their
  # names contain `zod3`; they import `zod/v3` and `zod-to-json-schema`).
  zod3:
    name: zod3 (node 24, zod 3.25.76)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Swapped in place and never committed.
      - name: Use zod 3.25.76
        run: |
          pnpm -F @toolmark/core add -D zod@3.25.76
          pnpm install --no-frozen-lockfile
      - name: Assert zod 3.25.76 is resolved
        run: |
          set -euo pipefail
          out="$(pnpm -F @toolmark/core list zod --depth 0)"
          echo "$out"
          grep -qF " zod@3.25.76" <<<"$out" \
            || { echo "::error::@toolmark/core does not resolve zod@3.25.76"; exit 1; }
      - run: pnpm exec vitest run --project core-node -t zod3

  # The browser axis (Chromium, Firefox, WebKit): the Vitest DOM projects' Firefox and WebKit
  # instances (Chromium runs in every `unit` cell) and the examples/react-vite Playwright project for
  # that browser. WebMCP suites (and the chromium-only e2e specs) run on Chromium only.
  browser:
    name: browser (${{ matrix.browser }})
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built output first: Playwright spec files load in Node (no @toolmark/source), and the lint
      # and MCP specs spawn the built CLIs.
      - run: pnpm -r --filter "./packages/*" build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Install ${{ matrix.browser }} system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps "${{ matrix.browser }}"
      - name: Vitest DOM projects (${{ matrix.browser }})
        if: matrix.browser != 'chromium'
        run: pnpm exec vitest run --project "*(${{ matrix.browser }})"
      - run: pnpm -F @toolmark-examples/react-vite typecheck
      - name: Playwright (react-vite, ${{ matrix.browser }})
        run: pnpm -F @toolmark-examples/react-vite exec playwright test --project="${{ matrix.browser }}"
        env:
          ROUND_BUDGET_REPORT: round-budget.json
      # Release-candidate evidence: the tour and same-tools suites against built dist.
      - name: Playwright on built dist (react-vite, ${{ matrix.browser }})
        run: pnpm -F @toolmark-examples/react-vite exec playwright test e2e/same-tools.spec.ts e2e/tour.spec.ts --project="${{ matrix.browser }}"
        env:
          TOOLMARK_DIST: '1'
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-vite-${{ matrix.browser }}-test-results
          path: examples/react-vite/test-results/
          if-no-files-found: ignore
      - if: matrix.browser == 'chromium'
        run: pnpm -F @toolmark-examples/react-vite build
      - name: Production build has no test hook
        if: matrix.browser == 'chromium'
        run: |
          if grep -rqE "__toolmark_(test|agent)__" examples/react-vite/dist; then
            echo "::error::examples/react-vite/dist contains a test-only global"
            exit 1
          fi
      # round-budget.spec.ts runs on Chromium only (one report row per task).
      - name: Upload round-budget report
        if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: round-budget
          path: examples/react-vite/round-budget.json
          if-no-files-found: error

  # Package quality (spec §17, §21): publint --strict and attw --profile esm-only on every packed
  # tarball, size budgets (gzip), zero core dependencies, package metadata, no app code, workflow
  # hardening.
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm quality

  types-ts7:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack tarballs
        run: pnpm -r --filter "./packages/*" pack --pack-destination "$PWD/dist-tarballs"
      # TypeScript 6.0.3 and 7.0.2 over the packed types (nodenext + bundler), imports, JSON, bins.
      - name: Tarball smoke test
        run: node scripts/tarball-smoke.mjs dist-tarballs
      - name: Script tests
        run: node --test "scripts/*.test.mjs"

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TypeDoc (non-strict through M4, zero warnings) + VitePress.
      - run: pnpm docs:build
      - run: pnpm docs:check
      # The Laravel reference guide must show examples/inertia-laravel/app/Toolmark/*.php byte for
      # byte.
      - name: Laravel reference matches the example
        run: node scripts/check-laravel-reference.mjs

  example-nextjs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbopack resolves @toolmark/* through `import` (dist/): build the packages first.
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -F @toolmark-examples/nextjs build
      - run: pnpm -F @toolmark-examples/nextjs typecheck
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -F @toolmark-examples/nextjs exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -F @toolmark-examples/nextjs exec playwright install-deps chromium
      # next dev (3100, test hook) and next start (3101, production) via the example's globalSetup.
      - name: Playwright (nextjs, Chromium)
        run: pnpm -F @toolmark-examples/nextjs exec playwright test
      - name: Upload Playwright traces and server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-nextjs-test-results
          path: examples/nextjs/test-results/
          if-no-files-found: ignore

  example-laravel:
    name: example-laravel (bridge-cache ${{ matrix.bridge-cache }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bridge-cache: [database, redis]
    # GitHub Actions has no per-matrix-cell `if:` for services (actions/runner#822), so the redis
    # container runs for both legs; only the redis leg's CACHE_STORE actually uses it.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CACHE_STORE: ${{ matrix.bridge-cache }}
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PHP on PATH before anything that touches it, including `pnpm build` (the Wayfinder Vite
      # plugin shells out to `php artisan wayfinder:generate`).
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2 (the tag has no v prefix)
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pcntl, redis
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Composer cache directory
        id: composer-cache
        working-directory: examples/inertia-laravel
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('examples/inertia-laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      # Resolves @toolmark/* through `import` (dist/), like the other example jobs.
      - run: pnpm -r --filter "./packages/*" build
      - name: Composer install
        working-directory: examples/inertia-laravel
        run: scripts/php.sh composer install --no-interaction --prefer-dist
      - name: toolmark:setup (.env, key, fresh SQLite database + seed)
        working-directory: examples/inertia-laravel
        run: scripts/php.sh composer run toolmark:setup
      - name: PHPUnit
        working-directory: examples/inertia-laravel
        run: scripts/php.sh php artisan test
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm -F @toolmark-examples/inertia-laravel exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -F @toolmark-examples/inertia-laravel exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -F @toolmark-examples/inertia-laravel exec playwright install-deps chromium
      - run: pnpm -F @toolmark-examples/inertia-laravel build
      # After the build: the Vite build runs Wayfinder, which generates the route/action modules
      # the example's TypeScript imports.
      - run: pnpm -F @toolmark-examples/inertia-laravel typecheck
      # Starts `artisan serve` (8010) and Reverb (8081) via the example's globalSetup.
      - name: Playwright (inertia-laravel, Chromium)
        run: pnpm -F @toolmark-examples/inertia-laravel exec playwright test
      - name: composer audit
        working-directory: examples/inertia-laravel
        continue-on-error: true
        run: scripts/php.sh composer audit
      - name: Upload Playwright traces and server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-laravel-${{ matrix.bridge-cache }}-test-results
          path: examples/inertia-laravel/test-results/
